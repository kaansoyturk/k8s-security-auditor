<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Security Auditor — Kubernetes Güvenlik Denetimi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }

        .header { background: #161b22; border-bottom: 1px solid #21262d; padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header h1 { color: #326ce5; font-size: 24px; font-weight: 700; }
        .header span { color: #8b949e; font-size: 14px; }
        .cluster-badge { background: #1f3a5f; color: #326ce5; padding: 4px 12px; border-radius: 12px; font-size: 12px; }

        .hero { text-align: center; padding: 50px 20px 30px; }
        .hero h2 { font-size: 32px; color: #e6edf3; margin-bottom: 12px; }
        .hero p { color: #8b949e; font-size: 15px; margin-bottom: 32px; }

        .scan-btn { padding: 14px 40px; background: #326ce5; border: none; border-radius: 8px; color: white; font-size: 16px; cursor: pointer; font-weight: 700; transition: background 0.2s; }
        .scan-btn:hover { background: #2563c7; }
        .scan-btn:disabled { background: #21262d; cursor: not-allowed; }

        .loading { text-align: center; padding: 60px; display: none; }
        .spinner { width: 48px; height: 48px; border: 4px solid #21262d; border-top: 4px solid #326ce5; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #8b949e; font-size: 14px; }

        .results { max-width: 1100px; margin: 0 auto; padding: 20px 40px 60px; display: none; }

        .score-card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 32px; text-align: center; margin-bottom: 24px; }
        .score-number { font-size: 80px; font-weight: 700; line-height: 1; }
        .score-grade { font-size: 24px; font-weight: 600; margin: 8px 0; }
        .score-level { font-size: 16px; color: #8b949e; margin-bottom: 20px; }
        .score-green { color: #3fb950; }
        .score-yellow { color: #d29922; }
        .score-orange { color: #f0883e; }
        .score-red { color: #f85149; }

        .scores-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 24px; }
        .score-item { background: #0d1117; border-radius: 8px; padding: 12px; text-align: center; }
        .score-item-label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
        .score-item-value { font-size: 20px; font-weight: 700; color: #326ce5; }

        .stats-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 16px; text-align: center; }
        .stat-number { font-size: 28px; font-weight: 700; color: #326ce5; }
        .stat-label { font-size: 11px; color: #8b949e; margin-top: 4px; }

        .section { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
        .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .section-title { font-size: 16px; font-weight: 600; color: #e6edf3; }
        .section-badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: #21262d; color: #8b949e; }

        .issue-list { list-style: none; }
        .issue-list li { padding: 8px 12px; background: #3a1a1a; border-radius: 6px; color: #f85149; font-size: 13px; margin-bottom: 6px; }
        .issue-list li::before { content: "⚠ "; }

        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .info-item { background: #0d1117; border-radius: 8px; padding: 12px; }
        .info-label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
        .info-value { font-size: 13px; color: #e6edf3; }

        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin: 2px; }
        .tag-green { background: #1a3a2a; color: #3fb950; }
        .tag-red { background: #3a1a1a; color: #f85149; }
        .tag-yellow { background: #3a2a0a; color: #d29922; }
        .tag-blue { background: #1f3a5f; color: #326ce5; }
        .tag-orange { background: #3a1f0a; color: #f0883e; }

        .card { background: #0d1117; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
        .card-title { font-size: 14px; font-weight: 600; color: #e6edf3; margin-bottom: 6px; }
        .card-sub { font-size: 11px; color: #8b949e; margin-bottom: 6px; }

        .cis-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-bottom: 1px solid #21262d; }
        .cis-item:last-child { border-bottom: none; }
        .cis-id { color: #8b949e; font-size: 11px; min-width: 35px; margin-top: 2px; }
        .cis-content { flex: 1; }
        .cis-title { font-size: 13px; color: #c9d1d9; margin-bottom: 4px; }
        .cis-detail { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
        .cis-remediation { font-size: 11px; color: #3fb950; }
        .pass-badge { background: #1a3a2a; color: #3fb950; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; white-space: nowrap; }
        .fail-badge { background: #3a1a1a; color: #f85149; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; white-space: nowrap; }
        .sev-CRITICAL { color: #f85149; }
        .sev-HIGH { color: #f0883e; }
        .sev-MEDIUM { color: #d29922; }

        .error-box { background: #3a1a1a; border: 1px solid #f85149; border-radius: 8px; padding: 20px; text-align: center; color: #f85149; margin: 20px auto; max-width: 600px; }

        .progress-bar { background: #21262d; border-radius: 4px; height: 8px; margin-top: 8px; }
        .progress-fill { height: 100%; border-radius: 4px; background: #326ce5; transition: width 0.3s; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <span>⎈</span>
        <h1>K8s Security Auditor</h1>
        <span>— Kubernetes Güvenlik Denetim Platformu</span>
    </div>
    <span class="cluster-badge">🟢 minikube</span>
</div>

<div class="hero">
    <h2>Kubernetes Cluster'ını Denetle</h2>
    <p>RBAC, Pod, Network, Secret ve CIS Benchmark analizi — tek tıkla</p>
    <button class="scan-btn" id="scan-btn" onclick="startScan()">⎈ Denetimi Başlat</button>
</div>

<div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">RBAC politikaları analiz ediliyor...</div>
</div>

<div class="results" id="results"></div>

<script>
    const loadingMessages = [
        "RBAC politikaları analiz ediliyor...",
        "Pod güvenlik ayarları kontrol ediliyor...",
        "Network Policy'ler inceleniyor...",
        "Secret'lar taranıyor...",
        "CIS Benchmark çalıştırılıyor...",
        "Güvenlik skoru hesaplanıyor..."
    ];

    async function startScan() {
        document.getElementById("scan-btn").disabled = true;
        document.getElementById("loading").style.display = "block";
        document.getElementById("results").style.display = "none";

        let i = 0;
        const interval = setInterval(() => {
            document.getElementById("loading-text").textContent = loadingMessages[i % loadingMessages.length];
            i++;
        }, 3000);

        try {
            const response = await fetch("/api/scan");
            const data = await response.json();
            clearInterval(interval);
            document.getElementById("loading").style.display = "none";
            document.getElementById("scan-btn").disabled = false;

            if (data.error) { showError(data.error); return; }
            showResults(data);

        } catch (err) {
            clearInterval(interval);
            document.getElementById("loading").style.display = "none";
            document.getElementById("scan-btn").disabled = false;
            showError("Bağlantı hatası: " + err.message);
        }
    }

    function showError(msg) {
        const results = document.getElementById("results");
        results.style.display = "block";
        results.innerHTML = `<div class="error-box">❌ ${msg}</div>`;
    }

    function showResults(data) {
        const results = document.getElementById("results");
        results.style.display = "block";
        const s = data.score;
        const sc = `score-${s.color}`;

        let html = `
        <div class="score-card">
            <div class="score-number ${sc}">${s.total_score}</div>
            <div class="score-grade ${sc}">${s.grade} — ${s.level}</div>
            <div class="score-level">Kubernetes Cluster Güvenlik Skoru</div>
            <div class="scores-grid">
                <div class="score-item"><div class="score-item-label">RBAC</div><div class="score-item-value">${s.scores.rbac}</div></div>
                <div class="score-item"><div class="score-item-label">PODS</div><div class="score-item-value">${s.scores.pods}</div></div>
                <div class="score-item"><div class="score-item-label">NETWORK</div><div class="score-item-value">${s.scores.network}</div></div>
                <div class="score-item"><div class="score-item-label">SECRETS</div><div class="score-item-value">${s.scores.secrets}</div></div>
                <div class="score-item"><div class="score-item-label">CIS</div><div class="score-item-value">${s.scores.cis}</div></div>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card"><div class="stat-number">${s.namespace_count}</div><div class="stat-label">Namespace</div></div>
            <div class="stat-card"><div class="stat-number">${s.pod_count}</div><div class="stat-label">Pod</div></div>
            <div class="stat-card"><div class="stat-number">${s.secret_count}</div><div class="stat-label">Secret</div></div>
            <div class="stat-card"><div class="stat-number">${s.policy_count}</div><div class="stat-label">Network Policy</div></div>
            <div class="stat-card"><div class="stat-number" style="color:#3fb950">${s.cis_passed}</div><div class="stat-label">CIS Pass</div></div>
            <div class="stat-card"><div class="stat-number" style="color:#f85149">${s.cis_failed}</div><div class="stat-label">CIS Fail</div></div>
        </div>`;

        if (s.all_issues.length > 0) {
            html += `<div class="section">
                <div class="section-header"><span>⚠️</span><span class="section-title">Tespit Edilen Sorunlar</span><span class="section-badge">${s.all_issues.length} sorun</span></div>
                <ul class="issue-list">${s.all_issues.slice(0, 15).map(i => `<li>${i}</li>`).join("")}</ul>
            </div>`;
        }

        // RBAC
        const rbac = data.rbac;
        const dangerousBindings = rbac.role_bindings.filter(b => b.issues.length > 0);
        html += `<div class="section">
            <div class="section-header"><span>🔐</span><span class="section-title">RBAC Analizi</span><span class="section-badge">Skor: ${rbac.score}</span></div>
            <div class="info-grid">
                <div class="info-item"><div class="info-label">ClusterRole</div><div class="info-value">${rbac.cluster_roles.length}</div></div>
                <div class="info-item"><div class="info-label">Tehlikeli Role</div><div class="info-value">${rbac.cluster_roles.filter(r=>r.dangerous).length > 0 ? `<span class="tag tag-red">⚠ ${rbac.cluster_roles.filter(r=>r.dangerous).length}</span>` : '<span class="tag tag-green">✓ Yok</span>'}</div></div>
                <div class="info-item"><div class="info-label">RoleBinding</div><div class="info-value">${rbac.role_bindings.length}</div></div>
                <div class="info-item"><div class="info-label">ServiceAccount</div><div class="info-value">${rbac.service_accounts.length}</div></div>
            </div>
            ${dangerousBindings.length > 0 ? `<div style="margin-top:12px">${dangerousBindings.slice(0,3).map(b => `
                <div class="card">
                    <div class="card-title">🔐 ${b.name}</div>
                    <span class="tag tag-blue">${b.subject_kind}: ${b.subject}</span>
                    <span class="tag tag-red">Role: ${b.role}</span>
                    ${b.issues.map(i => `<div style="color:#f85149;font-size:11px;margin-top:4px">⚠ ${i}</div>`).join("")}
                </div>`).join("")}</div>` : ''}
        </div>`;

        // Pods
        const pods = data.pods;
        const problematicPods = pods.pods.filter(p => p.issues.length > 0);
        html += `<div class="section">
            <div class="section-header"><span>🐳</span><span class="section-title">Pod Analizi</span><span class="section-badge">Skor: ${pods.score}</span></div>
            <div class="info-grid">
                <div class="info-item"><div class="info-label">Toplam Pod</div><div class="info-value">${pods.pods.length}</div></div>
                <div class="info-item"><div class="info-label">Sorunlu Pod</div><div class="info-value">${problematicPods.length > 0 ? `<span class="tag tag-red">⚠ ${problematicPods.length}</span>` : '<span class="tag tag-green">✓ Yok</span>'}</div></div>
                <div class="info-item"><div class="info-label">Namespace'ler</div><div class="info-value">${pods.namespaces.join(", ")}</div></div>
            </div>
            ${problematicPods.length > 0 ? `<div style="margin-top:12px">${problematicPods.slice(0,5).map(p => `
                <div class="card">
                    <div class="card-title">🐳 ${p.name}</div>
                    <div class="card-sub">Namespace: ${p.namespace} | Skor: ${p.score}</div>
                    ${p.issues.slice(0,3).map(i => `<span class="tag tag-red">⚠ ${i}</span>`).join("")}
                </div>`).join("")}</div>` : ''}
        </div>`;

        // Network
        const net = data.network;
        html += `<div class="section">
            <div class="section-header"><span>🌐</span><span class="section-title">Network Analizi</span><span class="section-badge">Skor: ${net.score}</span></div>
            <div class="info-grid">
                <div class="info-item"><div class="info-label">Network Policy</div><div class="info-value">${net.network_policies.length}</div></div>
                <div class="info-item"><div class="info-label">Servis</div><div class="info-value">${net.services.length}</div></div>
                <div class="info-item"><div class="info-label">Ingress</div><div class="info-value">${net.ingresses.length}</div></div>
                <div class="info-item"><div class="info-label">LoadBalancer</div><div class="info-value">${net.services.filter(s=>s.type==='LoadBalancer').length > 0 ? `<span class="tag tag-yellow">⚠ ${net.services.filter(s=>s.type==='LoadBalancer').length}</span>` : '<span class="tag tag-green">✓ Yok</span>'}</div></div>
            </div>
        </div>`;

        // Secrets
        const sec = data.secrets;
        html += `<div class="section">
            <div class="section-header"><span>🔑</span><span class="section-title">Secret Analizi</span><span class="section-badge">Skor: ${sec.score}</span></div>
            <div class="info-grid">
                <div class="info-item"><div class="info-label">Toplam Secret</div><div class="info-value">${sec.secrets.length}</div></div>
                <div class="info-item"><div class="info-label">Sorunlu Secret</div><div class="info-value">${sec.secrets.filter(s=>s.issues.length>0).length > 0 ? `<span class="tag tag-red">⚠ ${sec.secrets.filter(s=>s.issues.length>0).length}</span>` : '<span class="tag tag-green">✓ Yok</span>'}</div></div>
            </div>
        </div>`;

        // CIS Benchmark
        const cis = data.cis;
        const passRate = Math.round((cis.passed / (cis.passed + cis.failed)) * 100);
        html += `<div class="section">
            <div class="section-header"><span>📋</span><span class="section-title">CIS Kubernetes Benchmark</span><span class="section-badge">${cis.passed} geçti / ${cis.failed} kaldı</span></div>
            <div style="margin-bottom:16px">
                <div style="display:flex;justify-content:space-between;font-size:12px;color:#8b949e;margin-bottom:4px">
                    <span>Uyumluluk Oranı</span><span>${passRate}%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width:${passRate}%;background:${passRate>=80?'#3fb950':passRate>=60?'#d29922':'#f85149'}"></div>
                </div>
            </div>
            <div>${cis.checks.map(c => `
                <div class="cis-item">
                    <span class="cis-id">${c.id}</span>
                    <div class="cis-content">
                        <div class="cis-title"><span class="sev-${c.severity}">[${c.severity}]</span> ${c.title}</div>
                        <div class="cis-detail">${c.detail}</div>
                        ${!c.passed && c.remediation ? `<div class="cis-remediation">💡 ${c.remediation}</div>` : ''}
                    </div>
                    <span class="${c.passed ? 'pass-badge' : 'fail-badge'}">${c.status}</span>
                </div>`).join("")}
            </div>
        </div>`;

        results.innerHTML = html;
        results.scrollIntoView({ behavior: "smooth" });
    }
</script>
</body>
</html>
